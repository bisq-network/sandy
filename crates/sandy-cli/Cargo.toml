[package]
name = "sandy-cli"
description = "Run a program inside an operating system sandbox described by a policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
autobins = false

[[bin]]
name = "sandy"
path = "src/main.rs"

# Test helper: tries one action per argument pair and prints the result. The escape tests run it
# inside the sandbox.
[[bin]]
name = "sandy-probe"
path = "src/bin/sandy-probe.rs"
test = false

[dependencies]
sandy-core.workspace = true
lexopt.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sandy-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sandy-macos.workspace = true

[target.'cfg(windows)'.dependencies]
sandy-windows.workspace = true

[lints]
workspace = true
