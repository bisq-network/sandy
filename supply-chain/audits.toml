
# cargo-vet audits file

[[audits.enumflags2]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.7.12"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, not only its unsafe code. The files are identical to the upstream tag v0.7.12 (commit 332c37f). No build script and no filesystem, network, process or environment access; dependencies are the exact-pinned enumflags2_derive and optional serde. All unsafe code (the from_bits_unchecked constructors, make_bitflags!, transmute_copy in exactly_one and Iter::next) is sound given the invariant that every set bit is a declared variant, which every safe constructor and operator keeps: from_bits_truncate and Not mask with ALL_BITS, so no operation adds undeclared bits, and serde deserialization uses the checked from_bits. An invalid value needs a caller that breaks the documented precondition of the unsafe from_bits_unchecked."

[[audits.enumflags2_derive]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.7.12"
notes = "Reviewed by AI review agents on behalf of wodoro: the whole crate. The files are identical to the upstream tag v0.7.12 (commit 332c37f, directory enumflags_derive). A proc-macro attribute that only parses and re-emits tokens with syn and quote: no build script, no unsafe code of its own, no filesystem, environment, process, network or time access, and output that depends only on its input. It emits the unsafe impl of RawBitFlags only after rejecting non-enums, generics, data-carrying variants, missing, signed, usize and non-integer reprs and more variants than bits; it checks literal discriminants for exactly one bit within the repr, adds a compile-time assertion for every other discriminant, and gives implicit variants unused bits. Gap: #[bitflags(default = X)] does not check that X is a variant, so the enum's author could put undeclared bits in DEFAULT."

