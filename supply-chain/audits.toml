[[audits.windows-sys]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.61.2"
notes = "Reviewed by AI review agents on behalf of wodoro: the manifests, the hand-written core (the s! and w! literal macros, GUID::from_u128, the UTF-8 to UTF-16 const helpers) and the generated modules sandy uses in full, and every generated item with a scanner. The files are identical to upstream windows-rs commit 32c3144, three commits past Release 71 on master that do not touch crates/libs/sys; windows-rs CI regenerates the bindings and fails on any difference. The scanner parsed all 246 generated files (177,851 items) and found every item fits a declaration shape: each of the 20,250 windows_link::link! invocations only names a system DLL, an ABI and a typed signature, and every module is gated by its own Cargo feature. The only unsafe code is 8,925 identical Default impls using core::mem::zeroed, and every target type was proven valid at all zero bytes; there is no build script, proc macro, test or ambient capability, and the imports and constants sandy uses match the SDK. Caveats: BOOLEAN is mapped to Rust bool, SDK alignment attributes are not expressed, and the SCARD_*_READERS constants are mis-encoded."

[[audits.winnow]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "1.0.4"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, not only its unsafe code, split across three reviewers (lib, parser, error, combinator, macros and the doc modules; stream, token and examples; ascii and binary). The files are identical to the upstream tag v1.0.4 (commit 7539ec0). No build script, proc macro or FFI; the only ambient capabilities (stderr, the COLUMNS variable, a terminal size query) are behind the non-default debug feature. The only unsafe code is get_unchecked in the public unsafe fns next_slice_unchecked and peek_slice_unchecked, which winnow never calls itself, and repr(transparent) transmutes in BStr and Bytes; all other slicing is checked, so a bad offset panics. Number parsers report overflow as an error and preallocation is capped at 64 KiB. Caveats: expression() recurses without a depth limit on prefix and right-associative operators, iterator() and expression() postfix operators have no must-consume guard, and bits::take does not check the bit count against the output width."
