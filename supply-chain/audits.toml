[[audits.toml]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "1.1.8+spec-1.1.0"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate (src, examples and manifests), not only its unsafe code. The files are identical to the upstream tag toml-v1.1.8 (commit ceac6e4). #![forbid(unsafe_code)]; no build script, proc macro, FFI, or filesystem, network, process or environment access outside the toml2json example. The table builder that consumes toml_parser's events reports duplicate keys, table redefinition and dotted-key or inline-table mixing as errors, and any reported error fails from_str, so no key is silently overwritten; integer and float conversions are range-checked, and float overflow to infinity is an error. Denial of service, measured with a parser that uses the crate: the recursion limit of 80 that toml sets through toml_parser's RecursionGuard can be bypassed (see the toml_parser audit), and on_array and on_inline_table recurse on the event stream without a bound of their own, so crafted input overflows the stack (an abort, not memory corruption); dotted keys amplify memory about 600 times (a 1 MiB document used 615 MB); and error messages echo the source line and decoded keys, including control characters, verbatim."

