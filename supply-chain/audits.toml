[[audits.seccompiler]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.5.0"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, not only its unsafe code. The files are identical to the upstream tag v0.5.0 (commit c3cf77d). No build script; dependencies are libc and, behind the json feature, serde and serde_json. The only unsafe code outside tests is prctl(PR_SET_NO_NEW_PRIVS) and seccomp(SECCOMP_SET_MODE_FILTER) on a repr(C) sock_fprog that borrows the caller's slice; both are sound, and the len as u16 cast can only truncate a hand-built program of more than 65535 instructions. The BPF generation was traced by hand (architecture check to KILL_PROCESS, per-syscall chains, both halves of 64-bit comparisons for every operator, 8-bit jump offsets kept in range with JA helpers, length limit below 4096): no path allows what the rules deny. Caveats: no x32 bit check, Dword compares only the low 32 bits, Errno and Trace data are masked to 16 bits, and the json frontend drops a no-args rule for a syscall that also has an args rule. tools/generate_syscall_tables.sh downloads kernel sources, but cargo never runs it."

