[[audits.hashbrown]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
delta = "0.14.0 -> 0.14.2"
notes = "Reviewed by AI review agents on behalf of wodoro: the whole 0.14.0 to 0.14.2 diff, the new safe HashTable API (src/table.rs, src/rayon/table.rs) in full, and the surrounding code of every changed unsafe site. The files are identical to the upstream tag v0.14.2 (commit 7cd193a). The RawTable refactor moves the allocator out of RawTableInner, drops the Allocator + Clone bound, adds the FullBucketsIndices iterator used by resize, and routes clone, clone_from, shrink_to, drain and into_iter through drop_inner_table; each changed unsafe site keeps the control byte, items and growth_left, and allocation layout invariants. The delta also fixes allocator leaks, a global dealloc in the rayon into_par_iter path and a free-before-allocate ordering in clone_from, and adds no build script, FFI, I/O or required dependency. Unchanged from 0.14.0 and fixed in 0.14.5 (#511): the clone_from_impl panic guard drops bucket 0 uninitialized if the clone of that element panics."

[[audits.indexmap]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
delta = "2.14.0 -> 2.14.2"
notes = "Reviewed by AI review agents on behalf of wodoro: the whole diff and the new code around every changed hunk. The files are identical to the upstream tag 2.14.2 (commit 41a8708). The unsafe get_disjoint_opt_mut of map/slice.rs moves to map/disjoint.rs, whose two functions check every index against the slice length and against earlier indices before creating any reference from as_mut_ptr, so bad indices return an error or panic first; sound for every input. Other changes add index assertions with the existing panic messages, use plain Eq where the lookup type is the key type, and stop the map and set macros from declaring a const that could shadow a caller's CAP. No other unsafe, build script or dependency changes."

[[audits.landlock]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.4.7"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, including the compatibility logic (ABI probe, BestEffort, SoftRequirement and HardRequirement, the per-ABI downgrade of handled rights, flags and rules, RulesetStatus and RestrictionStatus) and every error path, not only its unsafe code. The files are identical to the upstream tag v0.4.7 (commit 62fec0f). No build script, network, environment access or file writes; the library opens only caller-supplied paths with O_PATH, fstats them, and makes the three Landlock syscalls and prctl(PR_SET_NO_NEW_PRIVS). The other unsafe code is sound for any input through the safe API, the attribute layouts match the kernel UAPI, FullyEnforced is never reported when the kernel enforces less, and errors fail closed. Soundness bug: Erratum::current() keeps unknown kernel errata bits through BitFlags::from_bits_unchecked, so formatting or iterating its result on a kernel with newer errata is undefined behaviour; only the kernel decides that value. The default BestEffort level drops unsupported features without an error but reports it in RestrictionStatus, and HardRequirement turns every drop into an error."

