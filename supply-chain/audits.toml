[[audits.libc]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "0.2.191"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, split between two reviewers (the manifests, build.rs, the core modules, src/new, src/unix/mod.rs and src/unix/linux_like; every other platform module). The files are identical to the upstream tag 0.2.191 (commit ccc2ff4). Token-level scanners classified every item of all platform files as an extern declaration, constant, type alias or repr(C) record, and all 800 items with executable code (CMSG_*, FD_*, CPU_*, NLMSG_*, W* and makedev helpers, siginfo accessors, manual trait impls, LFS64 wrappers) were read in full and are sound for valid C-library inputs; src/unix/bsd/apple was read in full. build.rs only runs rustc --version (emcc or freebsd-version on those targets), reads cfg-related environment variables and prints cargo directives; it writes no files and uses no network. Constants and struct layouts for x86_64 and aarch64 Linux (musl and glibc) were compared with kernel and glibc headers, and the macOS layouts, constants and signatures sandy uses with XNU. Caveats on paths sandy does not use: with extra_traits, union PartialEq and Hash read uninitialized bytes; some Rust enums hold C-supplied values (Apple qos_class_t, FreeBSD devstat, PSP); Apple pthread_introspection_hook_install returns a non-nullable fn pointer; Android and Fuchsia CMSG_NXTHDR use pointer offsets from cmsg_len; musl SUN_LEN, ELF*_R_INFO and CPU_ALLOC_SIZE compute wrong values; FD_* and CPU_* abort on out-of-range numbers."

