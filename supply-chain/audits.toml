[[audits.toml_parser]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "1.1.5+spec-1.1.0"
notes = 'Reviewed by AI review agents on behalf of wodoro: every file of the crate (lexer, parser, decoders, source, error, debug and the manifest), not only its unsafe code. The files are identical to the upstream tag toml_parser-v1.1.5 (commit ceac6e4). No build script, proc macro, FFI or ambient capability; with the unsafe feature off (toml enables only alloc and std) it builds under forbid(unsafe_code), and the cfg(feature = "unsafe") slicing sites were also checked and only cut at ASCII bytes or the end of input. Every slice and index was checked for UTF-8 boundary panics, as were lexer and parser termination, escape decoding, multi-line strings and CR handling, and integer and float syntax; malformed input always produces a reported error. Known denial of service, confirmed by running a parser that uses it: error recovery for a { or [ in key position inside an inline table emits a close event without a matching open, which lowers the recursion guard of the toml crate, so input such as a={{}{}...b=[[[... nests past the limit of 80 and overflows the stack (an abort, not memory corruption).'

