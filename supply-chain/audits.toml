[[audits.syn]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
version = "2.0.119"
notes = "Reviewed by AI review agents on behalf of wodoro: every file of the crate, split across three reviewers (the manifests, src/gen, tests and benches; the parsing infrastructure and small modules; the syntax tree modules). The files are identical to the upstream tag 2.0.119 (commit 3295f9e). No build script, FFI, or filesystem, environment, network, process or time access in the library; the only std use is thread::current().id(). The unsafe code (cursor pointer arithmetic in buffer.rs, the lifetime transmutes in parse.rs and discouraged.rs, ThreadBound's Send and Sync, the repr(transparent) span casts in token.rs) was checked against the token buffer's Group and End offset invariant and is sound; a scanner re-derived all 2,143 generated items of src/gen from the type definitions, and literal parsing (escapes, BigInt integers, floats) and every unwrap and unreachable site were traced and are not reachable from parsed input. Caveats: parsing, Drop and printing recurse without a depth limit, so pathological source can overflow the compiler's stack at build time (an abort), and the nightly-only tests and benches download a rust-lang/rust archive without a checksum and unpack it with tar's Entry::unpack, which has no path-traversal guard."

[[audits.syn]]
who = "wodoro <woodencore@proton.me>"
criteria = "safe-to-deploy"
delta = "2.0.119 -> 3.0.9"
notes = "Reviewed by AI review agents on behalf of wodoro: the whole 2.0.119 to 3.0.9 diff and the surrounding new code of every hunk that touches unsafe code, the parsing infrastructure or the manifest; the generated src/gen files were also checked with a shape scanner (all 1,435 items fit the expected impl and fn shapes, with no unsafe). The files are identical to the upstream tag 3.0.9 (commit 7c44a55). The only new unsafe is one bump_ignore_group call in the crate-internal Cursor::peek_punct, which runs only on a Punct entry like the existing punct(); Cursor::prev_span became public with an unchanged body whose ptr.sub(1) is bounded by start_of_buffer, which holds for every cursor the safe API can produce. Dependencies, features and build configuration are unchanged, and nothing in src does filesystem, network, process or environment access; most of the change is the 3.0 syntax tree redesign, and its new unwrap, unreachable and assert sites are not reachable from parsed input. The test suite's download of a rust-lang/rust tarball predates this release; the delta only bumps its pinned commit."

