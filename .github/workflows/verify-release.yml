name: verify-release

# Run by hand with the tag of a published release, such as v1.0.0: builds every binary of the
# release again from the tag, the way scripts/release-build.sh builds a release binary, packs it
# the way scripts/release-pack.sh does, and compares each archive of the release with the archive
# built again, byte for byte. The run fails when any archive differs; the summary then says
# whether the files in it differ or only the archive.
#
# A binary built again matches only on a host of the triple that built the release (README.md,
# "Building a release binary again"). The runner below is the one the release workflow builds
# every binary on, x86_64 Linux. Run the workflow from the tag it checks (gh workflow run
# verify-release.yml --ref TAG -f tag=TAG), so that its runners and steps are those of the
# release workflow of that tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the release, such as v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  assets:
    # First, so that a release without archives ends the run before the builds take any runner
    # time. The token is used only in this job, which runs no code of the tag.
    runs-on: ubuntu-24.04
    steps:
      - name: Download the archives and check them against SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The release and its SHA256SUMS hold the six archives and nothing else, besides the
          # signature: an extra archive would be signed as well.
          version=${TAG#v}
          archives=$(for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl \
            x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc; do
            [[ "$target" == *windows* ]] && echo "sandy-$version-$target.zip" || echo "sandy-$version-$target.tar.gz"
          done | LC_ALL=C sort)
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            grep -vx -e SHA256SUMS -e SHA256SUMS.asc | LC_ALL=C sort)
          [[ "$assets" == "$archives" ]] || { echo "the release holds other assets than the six archives:"; echo "$assets"; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'sandy-*' --pattern SHA256SUMS
          cd release
          [[ "$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)" == "$archives" ]] ||
            { echo "SHA256SUMS lists other files than the six archives"; exit 1; }
          sha256sum --check --strict SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  windows-sdk:
    # As in release.yml: xwin runs on a runner of its own, never where sandy is built.
    needs: assets
    uses: ./.github/workflows/windows-sdk.yml
    with:
      ref: refs/tags/${{ inputs.tag }}

  build:
    needs: [assets, windows-sdk]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: ubuntu-24.04 }
          - { target: aarch64-apple-darwin, os: ubuntu-24.04 }
          - { target: x86_64-pc-windows-msvc, os: ubuntu-24.04, sdk: x86_64 }
          - { target: aarch64-pc-windows-msvc, os: ubuntu-24.04, sdk: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      # The token of the job stays out of .git/config, where the build scripts of the
      # dependencies could read it: no step here pushes or fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      # As in release.yml.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.sdk
        with:
          name: windows-sdk-${{ matrix.sdk }}
          path: ${{ runner.temp }}
      - name: Unpack the Windows libraries
        if: matrix.sdk
        shell: bash
        run: scripts/windows-sdk.sh unpack ${{ matrix.sdk }} "$RUNNER_TEMP/windows-sdk-${{ matrix.sdk }}.tar.gz"
      - name: Fetch what the build needs
        shell: bash
        run: scripts/release-fetch.sh
      - name: Build
        shell: bash
        run: scripts/without-network.sh scripts/release-build.sh ${{ matrix.target }}
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          archive=$(scripts/without-network.sh scripts/release-pack.sh ${{ matrix.target }})
          mkdir rebuilt
          cp "$archive" target/${{ matrix.target }}/release/sandy${{ contains(matrix.target, 'windows') && '.exe' || '' }} rebuilt/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-${{ matrix.target }}
          path: rebuilt/
          if-no-files-found: error

  compare:
    needs: [assets, build]
    # Also when a build failed, so that the other targets are still compared.
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      # The targets of the build job.
      TARGETS: >-
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        x86_64-apple-darwin aarch64-apple-darwin
        x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    steps:
      # For the files that each archive holds besides the binary. Nothing of the tag runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Compare the archives with the ones built again
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version = ' source/Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$TAG" || { echo "tag $TAG != v$version"; exit 1; }
          sum() { if [[ -f "$1" ]]; then sha256sum "$1" | cut -d' ' -f1; else echo none; fi; }
          echo "| Target | Result | SHA-256 in the release | SHA-256 built again |" > summary.md
          echo "|---|---|---|---|" >> summary.md
          : > differences.txt
          failed=0
          for target in $TARGETS; do
            exe=sandy; ext=tar.gz
            [[ "$target" == *windows* ]] && { exe=sandy.exe; ext=zip; }
            name="sandy-$version-$target"
            archive="artifacts/release/$name.$ext"
            repacked="artifacts/rebuilt-$target/$name.$ext"
            rebuilt="artifacts/rebuilt-$target/$exe"
            work="work/$target"
            mkdir -p "$work/released" "$work/expected/$name"
            if [[ -f "$archive" && "$ext" == zip ]]; then
              unzip -q "$archive" -d "$work/released"
            elif [[ -f "$archive" ]]; then
              tar -xzf "$archive" -C "$work/released"
            fi
            if [[ ! -f "$archive" ]]; then
              result="no archive in the release"
            elif [[ ! -f "$rebuilt" || ! -f "$repacked" ]]; then
              result="not built, see its build job"
            elif cmp -s "$archive" "$repacked"; then
              result=identical
            else
              # Which files differ, to tell a difference in a binary from one in the packing.
              cp "$rebuilt" source/README.md source/LICENSE-MIT source/LICENSE-APACHE "$work/expected/$name/"
              if (cd "$work" && diff -rq expected released) >> differences.txt; then
                result="same files, other archive bytes"
              else
                result=differs
              fi
            fi
            [[ "$result" == identical ]] || failed=1
            echo "| \`$target\` | $result | \`$(sum "$work/released/$name/$exe")\` | \`$(sum "$rebuilt")\` |" >> summary.md
          done
          cat summary.md differences.txt
          {
            echo "### $TAG built again from the tag"
            cat summary.md
            if [[ -s differences.txt ]]; then
              echo
              echo '```'
              cat differences.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"
