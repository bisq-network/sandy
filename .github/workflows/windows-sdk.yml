name: windows-sdk

# Fetches the Microsoft libraries that the Windows release binaries link against
# (scripts/windows-sdk.sh) and uploads them as the artifact windows-sdk-ARCH, a gzipped tar of
# crt/lib and sdk/lib. The workflows that build sandy.exe call this, so that xwin, whose code is
# not reviewed, runs on a runner of its own and never where sandy is built: the build job unpacks
# the artifact with scripts/windows-sdk.sh unpack, which checks every file against
# link/windows-sdk.sha256, so this runner need not be trusted.

on:
  workflow_call:
    inputs:
      arches:
        description: JSON list of the architectures to fetch
        type: string
        default: '["x86_64", "aarch64"]'
      ref:
        description: The ref whose scripts/windows-sdk.sh fetches them, by default that of the run
        type: string
        default: ""

permissions:
  contents: read

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.arches) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Fetch the libraries
        env:
          # The libraries come under the license of the Visual Studio Build Tools.
          XWIN_ACCEPT_LICENSE: true
        run: |
          set -euo pipefail
          sdk=$(scripts/windows-sdk.sh fetch ${{ matrix.arch }})
          # Not the artifact's own zip, which would turn each link into a copy of its target.
          tar -czf "$RUNNER_TEMP/windows-sdk-${{ matrix.arch }}.tar.gz" -C "$sdk" crt/lib sdk/lib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-sdk-${{ matrix.arch }}
          path: ${{ runner.temp }}/windows-sdk-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          # Already compressed.
          compression-level: 0
          retention-days: 1
