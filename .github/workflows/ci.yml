name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      # Per runner: the lowest Landlock ABI it must report, and the features that must be
      # checkable on it (skipping one of them fails that test). The check step prints the ABI
      # the runner has, so raise the floor when a runner image moves to a newer kernel.
      #
      # A `target` runs the suite for that target instead of the runner's own. The Linux
      # releases are static musl builds, a plain cargo test builds for glibc, and the two
      # differ in constants that sandy compiles into its filters (O_ACCMODE includes O_PATH on
      # musl), so the release targets run the suite too. Their skips have a list of their own:
      # a static program has no loader to check.
      matrix:
        include:
          - os: ubuntu-24.04
            min_landlock_abi: 5
            require: pty
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            min_landlock_abi: 5
            require: pty
          - os: ubuntu-22.04
            min_landlock_abi: 4
            require: pty
          - os: ubuntu-24.04-arm
            min_landlock_abi: 5
            require: pty
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            min_landlock_abi: 5
            require: pty
          - os: macos-15
            require: pty
          - os: windows-2025
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    env:
      SANDY_TEST_RUNNER: ${{ matrix.target && format('{0}-{1}', matrix.os, matrix.target) || matrix.os }}
      SANDY_TEST_MIN_LANDLOCK_ABI: ${{ matrix.min_landlock_abi }}
      SANDY_TEST_REQUIRE: ${{ matrix.require }}
      # The cargo option for an entry that names a target, else nothing. CARGO_BUILD_TARGET
      # would not do: cargo refuses it empty.
      TARGET_OPTION: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      # The arm64 Linux release binary is a static PIE that scripts/release-build.sh links
      # through scripts/link-static-pie.sh. Only a build for that target reads these two, so its
      # entry links every binary the same way, and the suite runs code linked as the release.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ github.workspace }}/scripts/link-static-pie.sh
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C linker-flavor=ld.lld
    steps:
      # The token of the job stays out of .git/config, where the build scripts of the
      # dependencies could read it: no step here pushes or fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      # Before anything is built: the toolchain must be the one rust-toolchain.toml pins,
      # installed from the archives that rust-toolchain.sha256 pins.
      - name: Verify the toolchain
        shell: bash
        run: scripts/verify-toolchain.sh
      - name: Show toolchain
        run: rustc --version && cargo --version
      # The release links the macOS binaries with rust-lld against link/MacOSX.sdk, which
      # declares the symbols of libSystem that sandy uses. This checks each one against the SDK,
      # and builds sandy that way for the suite, which then runs it instead of the debug build
      # (SANDY_TEST_BIN_DIR, next to the debug sandy-probe and sandy-marker).
      - name: Check the libSystem declarations against the SDK (macOS)
        if: runner.os == 'macOS'
        run: scripts/check-macos-stubs.sh
      - name: Build sandy as the release does (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          scripts/release-build.sh "$target"
          cargo build --locked --bin sandy-probe --bin sandy-marker
          mkdir -p "$RUNNER_TEMP/bin"
          cp "target/$target/release/sandy" target/debug/sandy-probe target/debug/sandy-marker "$RUNNER_TEMP/bin/"
          echo "SANDY_TEST_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - name: Check how this runner enforces the default policy
        run: cargo run --locked ${{ env.TARGET_OPTION }} --bin sandy -- check ${{ runner.os == 'Windows' && '--appcontainer sandy.escape-tests' || '' }}
      # The skip log is named per step: the runner context, which holds the temporary
      # directory, does not exist in the env block of a job, and the workflow would not load.
      - name: Test
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked ${{ env.TARGET_OPTION }} --workspace --all-targets --no-fail-fast
      - name: Compare the checks this runner skipped with its expected-skip list
        # Also after a failed test: a check that stopped running is what this step looks for. A
        # runner without a list in crates/sandy-cli/tests/expected-skips fails here and prints
        # the list to commit.
        if: ${{ !cancelled() }}
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked ${{ env.TARGET_OPTION }} -p sandy-cli --test runner -- --ignored --exact skips_match_the_expected_list --nocapture
      - name: Show sandbox denials (macOS)
        if: failure() && runner.os == 'macOS'
        run: log show --last 10m --style compact --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "Sandbox"' | tail -n 300
      - name: Show Defender detections (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-MpPreference | Select-Object MAPSReporting, SubmitSamplesConsent, CloudBlockLevel, DisableRealtimeMonitoring | Format-List
          Get-WinEvent -LogName 'Microsoft-Windows-Windows Defender/Operational' -MaxEvents 60 |
            Where-Object { $_.TimeCreated -gt (Get-Date).AddMinutes(-30) } |
            Format-List TimeCreated, Id, Message
      - name: Show crash reports (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "== $f"; head -c 6000 "$f"; echo
          done | tail -n 400

  windows-sdk:
    # As in release.yml: xwin runs on a runner of its own, never where sandy is built.
    uses: ./.github/workflows/windows-sdk.yml
    with:
      arches: '["x86_64"]'

  windows-release-build:
    # The release links sandy.exe on Linux, with rust-lld as lld-link against the Microsoft
    # libraries that link/windows-sdk.sha256 pins (scripts/windows-sdk.sh). This builds it that way
    # for windows-release-test, which runs the suite against it, as the macOS entry of the test
    # job does with the macOS link.
    needs: windows-sdk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-sdk-x86_64
          path: ${{ runner.temp }}
      - name: Unpack the Windows libraries
        run: scripts/windows-sdk.sh unpack x86_64 "$RUNNER_TEMP/windows-sdk-x86_64.tar.gz"
      # As the release does: fetch with network, build without.
      - name: Fetch what the build needs
        run: scripts/release-fetch.sh
      - name: Build sandy.exe as the release does
        run: scripts/without-network.sh scripts/release-build.sh x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandy-release-x86_64-pc-windows-msvc
          path: target/x86_64-pc-windows-msvc/release/sandy.exe
          if-no-files-found: error

  windows-release-test:
    needs: windows-release-build
    runs-on: windows-2025
    env:
      SANDY_TEST_RUNNER: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Verify the toolchain
        shell: bash
        run: scripts/verify-toolchain.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandy-release-x86_64-pc-windows-msvc
          path: release-bin
      - name: Put the release sandy.exe next to the helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --bin sandy-probe
          mkdir -p "$RUNNER_TEMP/bin"
          cp release-bin/sandy.exe target/debug/sandy-probe.exe "$RUNNER_TEMP/bin/"
          echo "SANDY_TEST_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
      - name: Check how this runner enforces the default policy
        shell: bash
        run: '"$SANDY_TEST_BIN_DIR/sandy.exe" check --appcontainer sandy.escape-tests'
      - name: Test
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Compare the checks this runner skipped with its expected-skip list
        if: ${{ !cancelled() }}
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked -p sandy-cli --test runner -- --ignored --exact skips_match_the_expected_list --nocapture

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Verify the toolchain
        shell: bash
        run: scripts/verify-toolchain.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --target x86_64-unknown-linux-musl -- -D warnings
      - run: cargo check --locked --workspace --all-targets --target aarch64-apple-darwin
      # The archive packer of the release workflow, a workspace of its own.
      - run: cargo fmt --manifest-path tools/pack/Cargo.toml --check
      - run: cargo clippy --manifest-path tools/pack/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path tools/pack/Cargo.toml --locked
