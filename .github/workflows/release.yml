name: release

# A tag v<version> builds every platform and creates a DRAFT release with the archives, their
# SHA-256 sums and a build provenance attestation. A maintainer reviews and publishes it.
# Running the workflow by hand builds the archives without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # The dependency gates of audit.yml, so that a draft release exists only for a commit whose
    # crates pass cargo-deny and cargo-vet.
    uses: ./.github/workflows/audit.yml

  windows-sdk:
    # On a runner of its own, so that xwin never runs where sandy is built
    # (.github/workflows/windows-sdk.yml).
    uses: ./.github/workflows/windows-sdk.yml

  build:
    needs: windows-sdk
    strategy:
      fail-fast: false
      # x86_64 Linux builds every binary: rust-lld links the macOS ones there against the
      # libSystem declarations of link/MacOSX.sdk, and the Windows ones, as lld-link, against the
      # Microsoft libraries that link/windows-sdk.sha256 pins. A binary built again matches only
      # on a host of the same triple (README.md, "Building a release binary again"), so
      # verify-release.yml builds on the same runner.
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: ubuntu-24.04 }
          - { target: aarch64-apple-darwin, os: ubuntu-24.04 }
          - { target: x86_64-pc-windows-msvc, os: ubuntu-24.04, sdk: x86_64 }
          - { target: aarch64-pc-windows-msvc, os: ubuntu-24.04, sdk: aarch64 }
    runs-on: ${{ matrix.os }}
    # The SHA-256 sum of each packed archive, by target. The release job checks the archives it
    # downloads against these: an output comes only from this job, while an artifact can come from
    # any job of the run. Each leg sets only the output of its own target, and an unset output
    # does not replace the value another leg set.
    outputs:
      x86_64-unknown-linux-musl: ${{ steps.package.outputs.x86_64-unknown-linux-musl }}
      aarch64-unknown-linux-musl: ${{ steps.package.outputs.aarch64-unknown-linux-musl }}
      x86_64-apple-darwin: ${{ steps.package.outputs.x86_64-apple-darwin }}
      aarch64-apple-darwin: ${{ steps.package.outputs.aarch64-apple-darwin }}
      x86_64-pc-windows-msvc: ${{ steps.package.outputs.x86_64-pc-windows-msvc }}
      aarch64-pc-windows-msvc: ${{ steps.package.outputs.aarch64-pc-windows-msvc }}
    env:
      # Whether the signing secrets exist, which gates the two signing steps below; today they
      # do not, so both steps stay skipped. A step's `if` cannot read a secret, so the test is
      # made here, and only its answer is kept: every step sees this block, also the build, which
      # runs the build scripts and macros of the dependencies. The secrets themselves go only to
      # the step that signs.
      APPLE_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      WINDOWS_SIGNING: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE != '' }}
    steps:
      # The token of the job stays out of .git/config, where the build scripts of the
      # dependencies could read it: no step here pushes or fetches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Check that the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      # The Microsoft libraries of a Windows target, fetched by the windows-sdk job and checked
      # here against link/windows-sdk.sha256.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.sdk
        with:
          name: windows-sdk-${{ matrix.sdk }}
          path: ${{ runner.temp }}
      - name: Unpack the Windows libraries
        if: matrix.sdk
        shell: bash
        run: scripts/windows-sdk.sh unpack ${{ matrix.sdk }} "$RUNNER_TEMP/windows-sdk-${{ matrix.sdk }}.tar.gz"
      # The toolchain and the crates, with network; the build and the packing below run without,
      # so no build script or procedural macro can fetch code or send anything out
      # (scripts/release-fetch.sh, scripts/without-network.sh).
      - name: Fetch what the build needs
        shell: bash
        run: scripts/release-fetch.sh
      # The same script builds every release binary outside CI too (README.md, "Verifying a
      # download"), so a binary can be built again and compared.
      - name: Build
        shell: bash
        run: scripts/without-network.sh scripts/release-build.sh ${{ matrix.target }}
      # Skipped: this project has no Apple Developer ID, so the macOS binaries carry only the
      # linker's ad-hoc signature. To sign and notarize them, join the Apple Developer Program,
      # export the "Developer ID Application" certificate as a PKCS#12 file, and add six
      # repository secrets: APPLE_SIGNING_IDENTITY (the certificate's common name),
      # APPLE_SIGNING_CERTIFICATE (the PKCS#12 file, base64 encoded) with
      # APPLE_SIGNING_CERTIFICATE_PASSWORD, and an App Store Connect key for notarytool,
      # APPLE_NOTARY_KEY (base64 encoded) with APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER.
      # None of them exists today. Before turning this on, check on a Mac that the hardened
      # runtime still lets sandy load /usr/lib/libsandbox.1.dylib and exec an unsigned program.
      # A bare Mach-O cannot be stapled, so Gatekeeper checks the notarization online. The macOS
      # binaries are built on Linux, which has no codesign or notarytool: before turning this on,
      # move this step into a job on a macOS runner that signs the binary before it is packaged.
      - name: Sign and notarize the macOS binary
        if: ${{ contains(matrix.target, 'apple') && env.APPLE_SIGNING == 'true' }}
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_CERTIFICATE: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          APPLE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/sandy"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_SIGNING_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -T /usr/bin/codesign \
            -P "$APPLE_SIGNING_CERTIFICATE_PASSWORD"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          echo "$APPLE_NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --issuer "$APPLE_NOTARY_ISSUER" --key-id "$APPLE_NOTARY_KEY_ID" --key "$RUNNER_TEMP/notary.p8"
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notarize.zip"
      # Skipped: this project has no code signing certificate, so Windows SmartScreen warns
      # about a freshly downloaded sandy.exe and some enterprise policies refuse it. An OV or EV
      # certificate costs money and today lives in a hardware token or a signing service, so the
      # step below only fits a certificate that can still be exported as a PKCS#12 file; a
      # signing service wants its own step instead. The secrets are WINDOWS_SIGNING_CERTIFICATE
      # (the PKCS#12 file, base64 encoded) and WINDOWS_SIGNING_CERTIFICATE_PASSWORD. Neither
      # exists today. The Windows binaries are built on Linux, which has no signtool: before
      # turning this on, move this step into a job on a Windows runner that signs the binary
      # before it is packaged.
      - name: Sign sandy.exe
        if: ${{ contains(matrix.target, 'windows') && env.WINDOWS_SIGNING == 'true' }}
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName | Select-Object -Last 1
          & $signtool.FullName sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD `
            "target/${{ matrix.target }}/release/sandy.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      # No other step runs the binary that is packaged, and the tests run a debug build. A link
      # that leaves the image without its relocations, for example, crashes before main. The
      # others are started on runners of their own: the arm64 Linux binary by the start job, the
      # macOS and Windows binaries by test-macos and test-windows.
      - name: Start the binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        shell: bash
        run: |
          exe=sandy; [[ "${{ matrix.target }}" == *windows* ]] && exe=sandy.exe
          "target/${{ matrix.target }}/release/$exe" --version
      # The archive comes from tools/pack, not from the tar, gzip or 7-Zip of the runner image,
      # so that it can be built again byte for byte (scripts/release-pack.sh).
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          archive=$(scripts/without-network.sh scripts/release-pack.sh ${{ matrix.target }})
          ls -l "$archive"
          sum=$(sha256sum "$archive" | cut -d' ' -f1)
          echo "${{ matrix.target }}=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandy-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  start:
    # The arm64 Linux binary is built on x86_64, whose runner cannot run it. This starts the
    # packaged binary on arm64, for the reason the build job starts the others; its link, a static
    # PIE through scripts/link-static-pie.sh, is one of the links that rustc does not make by
    # itself. The macOS and Windows binaries, the others built where they cannot run, go through
    # test-macos and test-windows.
    needs: build
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandy-aarch64-unknown-linux-musl
          path: dist
      - name: Start the binary
        run: |
          set -euo pipefail
          archive=(dist/sandy-*-aarch64-unknown-linux-musl.tar.gz)
          tar -xzf "${archive[0]}" -C dist
          "${archive[0]%.tar.gz}/sandy" --version

  test-macos:
    # The macOS binaries are linked on Linux, by rust-lld against the libSystem declarations of
    # link/MacOSX.sdk, so no Mac has run them before this. This runs the whole suite against each
    # packaged binary on the macOS versions of the runners, the x86_64 one on an Intel Mac, since
    # sandy refuses to run through Rosetta. The tests and the helpers sandy-probe and
    # sandy-marker are built here from the same commit; SANDY_TEST_BIN_DIR points the suite at
    # the packaged sandy. Then the skips are compared with the runner's list, as in ci.yml.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-26 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    env:
      SANDY_TEST_RUNNER: ${{ matrix.os }}
      SANDY_TEST_REQUIRE: pty
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Verify the toolchain
        shell: bash
        run: scripts/verify-toolchain.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandy-${{ matrix.target }}
          path: dist
      - name: Put the packaged sandy next to the helpers
        run: |
          set -euo pipefail
          archive=(dist/sandy-*-${{ matrix.target }}.tar.gz)
          tar -xzf "${archive[0]}" -C dist
          cargo build --locked --bin sandy-probe --bin sandy-marker
          mkdir -p "$RUNNER_TEMP/bin"
          cp "${archive[0]%.tar.gz}/sandy" target/debug/sandy-probe target/debug/sandy-marker "$RUNNER_TEMP/bin/"
          echo "SANDY_TEST_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/sandy" --version
      - name: Test
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Compare the checks this runner skipped with its expected-skip list
        if: ${{ !cancelled() }}
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked -p sandy-cli --test runner -- --ignored --exact skips_match_the_expected_list --nocapture
      - name: Show sandbox denials
        if: failure()
        run: log show --last 10m --style compact --predicate 'sender == "Sandbox" OR eventMessage CONTAINS "Sandbox"' | tail -n 300

  test-windows:
    # The Windows binaries are linked on Linux, by rust-lld as lld-link against the Microsoft
    # libraries that link/windows-sdk.sha256 pins, so no Windows host has run them before this.
    # This runs the whole suite against each packaged binary on the Windows versions of the
    # runners, the arm64 one on an arm64 runner. The tests and the helper sandy-probe are built
    # here from the same commit; SANDY_TEST_BIN_DIR points the suite at the packaged sandy.exe.
    # Then the skips are compared with the runner's list, as in ci.yml.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: x86_64-pc-windows-msvc, os: windows-2022 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      SANDY_TEST_RUNNER: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./.github/actions/rustup
      - name: Verify the toolchain
        shell: bash
        run: scripts/verify-toolchain.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandy-${{ matrix.target }}
          path: dist
      - name: Put the packaged sandy.exe next to the helper
        shell: bash
        run: |
          set -euo pipefail
          archive=(dist/sandy-*-${{ matrix.target }}.zip)
          # Expand-Archive: every Windows image has it, unlike unzip or 7-Zip.
          pwsh -NoProfile -Command "Expand-Archive -Path '${archive[0]}' -DestinationPath dist"
          cargo build --locked --bin sandy-probe
          mkdir -p "$RUNNER_TEMP/bin"
          cp "${archive[0]%.zip}/sandy.exe" target/debug/sandy-probe.exe "$RUNNER_TEMP/bin/"
          echo "SANDY_TEST_BIN_DIR=$RUNNER_TEMP/bin" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/bin/sandy.exe" --version
      - name: Check how this runner enforces the default policy
        shell: bash
        run: '"$SANDY_TEST_BIN_DIR/sandy.exe" check --appcontainer sandy.escape-tests'
      - name: Test
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Compare the checks this runner skipped with its expected-skip list
        if: ${{ !cancelled() }}
        env:
          SANDY_TEST_SKIP_LOG: ${{ runner.temp }}/sandy-skips.log
        run: cargo test --locked -p sandy-cli --test runner -- --ignored --exact skips_match_the_expected_list --nocapture

  reproducible:
    # The release build removes what would otherwise tie a binary to the machine that made it:
    # the path prefix of the checkout and of CARGO_HOME, the time of the build, the host's linker
    # and SDK, and the debug map that the macOS link hashes into the UUID; tools/pack does the same
    # for the archive. This builds and packs every target twice from two directories and compares
    # the binaries and the archives, and compares the archive with the one the build job made on
    # another runner, so a change that makes the output depend on where it is built is noticed.
    # It does not gate the release: a difference here is a finding to read, not a reason to keep a
    # reviewed tag from being packaged.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: x86_64-apple-darwin, os: ubuntu-24.04 }
          - { target: aarch64-apple-darwin, os: ubuntu-24.04 }
          - { target: x86_64-pc-windows-msvc, os: ubuntu-24.04, sdk: x86_64 }
          - { target: aarch64-pc-windows-msvc, os: ubuntu-24.04, sdk: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: first
          persist-credentials: false
      # rustup from the pinned rustup-init, not the runner image's (scripts/install-rustup.sh).
      - uses: ./first/.github/actions/rustup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sandy-${{ matrix.target }}
          path: built
      # As in the build job; the copy below takes them along.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.sdk
        with:
          name: windows-sdk-${{ matrix.sdk }}
          path: ${{ runner.temp }}
      - name: Unpack the Windows libraries
        if: matrix.sdk
        shell: bash
        run: first/scripts/windows-sdk.sh unpack ${{ matrix.sdk }} "$RUNNER_TEMP/windows-sdk-${{ matrix.sdk }}.tar.gz"
      # As in the build job.
      - name: Fetch what the build needs
        shell: bash
        run: first/scripts/release-fetch.sh
      - name: Build twice and compare
        shell: bash
        run: |
          set -euo pipefail
          target=${{ matrix.target }}
          exe=sandy; [[ "$target" == *windows* ]] && exe=sandy.exe
          cp -a first second
          for dir in first second; do
            first/scripts/without-network.sh "$dir/scripts/release-build.sh" "$target"
          done
          sum=sha256sum; command -v sha256sum > /dev/null || sum="shasum -a 256"
          $sum first/target/"$target"/release/$exe second/target/"$target"/release/$exe
          cmp first/target/"$target"/release/$exe second/target/"$target"/release/$exe \
            || { echo "the binary depends on the directory it was built in"; exit 1; }
          for dir in first second; do
            first/scripts/without-network.sh "$dir/scripts/release-pack.sh" "$target" > /dev/null
          done
          archive=$(cd first/dist && ls)
          $sum first/dist/"$archive" second/dist/"$archive" built/"$archive"
          cmp first/dist/"$archive" second/dist/"$archive" \
            || { echo "the archive depends on the directory it was packed in"; exit 1; }
          cmp first/dist/"$archive" built/"$archive" \
            || { echo "the archive differs from the one the build job packed on another runner"; exit 1; }

  release:
    needs: [audit, build, start, test-macos, test-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # A required reviewer of this environment, set in the repository settings, has to approve the
    # job before it attests anything or creates the draft.
    environment: release
    permissions:
      contents: write
      # For the build provenance attestation below.
      id-token: write
      attestations: write
    env:
      # The targets of the build job.
      TARGETS: >-
        x86_64-unknown-linux-musl aarch64-unknown-linux-musl
        x86_64-apple-darwin aarch64-apple-darwin
        x86_64-pc-windows-msvc aarch64-pc-windows-msvc
    steps:
      # The archives only, not the Windows libraries of the windows-sdk job.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: sandy-*
          merge-multiple: true
      # Exactly the six archives of this version and nothing else: any job of the run could upload
      # an artifact, and whatever lies here is summed, attested and released.
      - name: Check the set of archives
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          expected=$(for target in $TARGETS; do
            [[ "$target" == *windows* ]] && echo "sandy-$version-$target.zip" || echo "sandy-$version-$target.tar.gz"
          done | LC_ALL=C sort)
          actual=$(cd dist && find . -mindepth 1 | sed 's|^\./||' | LC_ALL=C sort)
          [[ "$actual" == "$expected" ]] || { echo "dist holds other files than the six archives:"; echo "$actual"; exit 1; }
      # The names say nothing about who uploaded an archive: another job of the run could have
      # replaced one with a file of the same name. Each archive must have the sum that its build
      # job reported as an output.
      - name: Check the archives against the sums of the build job
        shell: bash
        env:
          BUILT: ${{ toJSON(needs.build.outputs) }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          for target in $TARGETS; do
            archive=sandy-$version-$target.tar.gz
            [[ "$target" == *windows* ]] && archive=sandy-$version-$target.zip
            expected=$(jq -r --arg target "$target" '.[$target] // ""' <<< "$BUILT")
            [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || { echo "the build job reported no sum for $target"; exit 1; }
            actual=$(sha256sum "dist/$archive" | cut -d' ' -f1)
            [[ "$actual" == "$expected" ]] || { echo "$archive is not the archive the build job packed"; exit 1; }
          done
      - name: Sum the archives
        shell: bash
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
      # Nothing is published if this step or the verification below fails.
      - name: Attest the build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # The strict form that README.md documents: this workflow, this tag, this commit, a runner of
      # GitHub. gh before 2.102.0 matched --signer-workflow by prefix and --source-ref ignoring
      # case.
      - name: Verify the attestations before anything is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh --version | sed -n '1s/^gh version \([0-9.]*\).*/\1/p')
          [ "$(printf '%s\n' 2.102.0 "$version" | sort -V | head -n 1)" = 2.102.0 ] ||
            { echo "gh $version is older than 2.102.0"; exit 1; }
          for archive in dist/*.tar.gz dist/*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "sandy $GITHUB_REF_NAME" \
            --notes "Draft of commit $GITHUB_SHA. Every archive carries a build provenance attestation: check one with \`gh attestation verify <archive> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref $GITHUB_REF --source-digest $GITHUB_SHA --deny-self-hosted-runners\` (gh 2.102.0 or later). Verify the archives against SHA256SUMS, then sign SHA256SUMS with the project key and upload the signature as an asset before publishing; a published release takes no further assets. The aarch64 Windows build is cross-compiled and not tested at run time." \
            ./*.tar.gz ./*.zip SHA256SUMS
